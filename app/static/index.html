<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<title>Property Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f1ede5; --ink:#1c1a17; --muted:#77716a;
    --line:#e6e1d8; --accent:#9a7536; --accent-ink:#ffffff; --accent-soft:#f3ead9;
    --user:#1c1a17; --user-ink:#f7f5f0; --danger:#b4372b;
    --radius:16px; --shadow:0 1px 2px rgba(28,26,23,.04), 0 8px 24px rgba(28,26,23,.06);
    --maxw:780px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#121110; --surface:#1b1a18; --surface-2:#23211e; --ink:#ede9e1; --muted:#9a948a;
      --line:#2d2a26; --accent:#d4b06e; --accent-ink:#1b1a18; --accent-soft:#2b251a;
      --user:#ede9e1; --user-ink:#121110; --danger:#ef7b6e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100dvh;
  }
  button { font:inherit; color:inherit; }

  /* Header */
  .top {
    position:sticky; top:0; z-index:5; backdrop-filter:saturate(1.4) blur(12px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .top-in { max-width:var(--maxw); margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .logo {
    width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center;
    background:var(--accent); color:var(--accent-ink);
  }
  .brand { font-weight:600; font-size:15px; line-height:1.2; }
  .brand small { display:block; font-weight:400; font-size:12px; color:var(--muted); }
  .new {
    margin-left:auto; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
    background:var(--surface); border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer;
  }
  .new:hover { border-color:var(--accent); }
  .new[hidden] { display:none; }

  /* Main */
  main { flex:1; width:100%; max-width:var(--maxw); margin:0 auto; padding:0 16px; }
  .hero { padding:clamp(32px, 9vh, 96px) 0 24px; text-align:center; }
  .hero h1 {
    font-family:"Playfair Display", Georgia, serif; font-weight:500;
    font-size:clamp(28px, 5.5vw, 42px); line-height:1.15; margin:0 0 10px; letter-spacing:-.01em;
  }
  .hero p { margin:0 auto; max-width:520px; color:var(--muted); font-size:clamp(14px, 2.2vw, 16px); }
  .cards { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; margin:28px 0 8px; text-align:left; }
  @media (max-width:560px) { .cards { grid-template-columns:1fr; } }
  .card {
    border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:14px 16px;
    cursor:pointer; text-align:left; transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover { border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px); }
  .card b { display:block; font-weight:500; font-size:14px; margin-bottom:2px; }
  .card span { font-size:12.5px; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }

  #log { padding:20px 0 8px; display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; gap:10px; align-items:flex-start; animation:in .25s ease; }
  @keyframes in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .row.user { justify-content:flex-end; }
  .avatar {
    width:28px; height:28px; border-radius:8px; flex:none; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent); margin-top:2px;
  }
  .bubble { min-width:0; max-width:100%; overflow-wrap:anywhere; }
  .user .bubble {
    background:var(--user); color:var(--user-ink); padding:10px 14px; border-radius:18px 18px 4px 18px;
    max-width:min(85%, 560px); white-space:pre-wrap;
  }
  .bot .bubble { flex:1; padding-top:3px; }
  .bot .bubble p { margin:0 0 .6em; } .bot .bubble p:last-child { margin-bottom:0; }
  .bot .bubble ul, .bot .bubble ol { margin:.3em 0 .7em; padding-left:1.25em; }
  .bot .bubble li { margin:.2em 0; }
  .bot .bubble a { color:var(--accent); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .bot .bubble a:hover { border-bottom-color:var(--accent); }
  .bot .bubble h1, .bot .bubble h2, .bot .bubble h3 { font-size:15px; margin:.8em 0 .3em; }
  .bot .bubble table { border-collapse:collapse; display:block; overflow-x:auto; margin:.5em 0; font-size:13.5px; }
  .bot .bubble th, .bot .bubble td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  .bot .bubble code { background:var(--surface-2); padding:1px 5px; border-radius:5px; font-size:.9em; }

  .sources { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .src {
    display:inline-flex; align-items:center; gap:6px; max-width:100%; font-size:12px; color:var(--muted) !important;
    border:1px solid var(--line) !important; background:var(--surface); border-radius:999px; padding:4px 10px;
  }
  .src:hover { border-color:var(--accent) !important; color:var(--ink) !important; }
  .src i { font-style:normal; font-weight:600; color:var(--accent); }
  .src em { font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .err { color:var(--danger); margin:0; }
  .typing { display:inline-flex; gap:4px; padding:8px 0; }
  .typing span { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.1s infinite; }
  .typing span:nth-child(2) { animation-delay:.15s; } .typing span:nth-child(3) { animation-delay:.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity:.25; } 40% { opacity:1; } }

  /* Composer */
  .dock {
    position:sticky; bottom:0; z-index:5;
    background:linear-gradient(to top, var(--bg) 70%, transparent);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .composer {
    max-width:var(--maxw); margin:0 auto; display:flex; align-items:flex-end; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:6px 6px 6px 16px;
    box-shadow:var(--shadow); transition:border-color .15s;
  }
  .composer:focus-within { border-color:var(--accent); }
  textarea {
    flex:1; border:0; outline:0; resize:none; background:transparent; color:var(--ink);
    font:inherit; font-size:16px; line-height:1.5; padding:8px 0; max-height:180px;
  }
  textarea::placeholder { color:var(--muted); }
  .send {
    width:40px; height:40px; flex:none; border:0; border-radius:50%; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; transition:opacity .15s;
  }
  .send:disabled { opacity:.35; cursor:default; }
  .note { max-width:var(--maxw); margin:8px auto 0; text-align:center; font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      <div class="brand">Property Assistant<small>DarGlobal · Wasalt</small></div>
      <button class="new" id="new" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
  </header>

  <main>
    <section class="hero" id="hero">
      <h1>Find your next property</h1>
      <p>Ask about DarGlobal's luxury developments worldwide or property listings across Saudi Arabia on Wasalt.</p>
      <div class="cards">
        <button class="card" data-q="What DarGlobal projects are in Oman?"><span class="tag">DarGlobal</span><b>Projects in Oman</b><span>AIDA, branded residences and villas</span></button>
        <button class="card" data-q="Tell me about The Astera by Aston Martin"><span class="tag">DarGlobal</span><b>The Astera by Aston Martin</b><span>Beachfront living on Al Marjan Island</span></button>
        <button class="card" data-q="How many 3 bedroom apartments are for rent on Wasalt?"><span class="tag">Wasalt</span><b>3-bedroom apartments for rent</b><span>Counts and example listings</span></button>
        <button class="card" data-q="What property types does Wasalt list in Jeddah?"><span class="tag">Wasalt</span><b>Properties in Jeddah</b><span>Types, districts and price bands</span></button>
      </div>
    </section>
    <div id="log" aria-live="polite"></div>
  </main>

  <div class="dock">
    <form class="composer" id="f">
      <textarea id="q" rows="1" placeholder="Ask about a project, city or listing…" aria-label="Message"></textarea>
      <button class="send" id="send" aria-label="Send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p class="note">Answers are generated from public website data and may be incomplete. Verify details with the developer or listing.</p>
  </div>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), q = $('q'), form = $('f'), sendBtn = $('send'), hero = $('hero'), newBtn = $('new');
const BOT_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>';
let history = [], busy = false;

marked.setOptions({ breaks: true });
const md = s => DOMPurify.sanitize(marked.parse(s));
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const scrollDown = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 180) + 'px'; sendBtn.disabled = busy || !q.value.trim(); }
q.addEventListener('input', autosize);

function addRow(role, html) {
  const row = document.createElement('div'); row.className = 'row ' + role;
  row.innerHTML = role === 'bot' ? `<div class="avatar">${BOT_ICON}</div><div class="bubble">${html}</div>` : `<div class="bubble">${html}</div>`;
  log.appendChild(row); scrollDown(); return row.querySelector('.bubble');
}

function linkify(bubble) {
  bubble.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

function renderSources(sources, answer) {
  // only show sources the answer actually links to
  const used = sources.filter(s => answer.includes(s.url));
  if (!used.length) return '';
  return '<div class="sources">' + used.slice(0, 5).map(s => {
    const label = (s.title || s.url).replace(/\s*\|.*$/, '');
    return `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener"><i>${esc(s.source)}</i><em>${esc(label)}</em></a>`;
  }).join('') + '</div>';
}

async function ask(text) {
  text = text.trim(); if (!text || busy) return;
  busy = true; hero.hidden = true; newBtn.hidden = false;
  addRow('user', esc(text)); history.push({ role: 'user', content: text });
  q.value = ''; autosize();
  const b = addRow('bot', '<div class="typing"><span></span><span></span><span></span></div>');
  let answer = '', sources = [], buf = '';
  try {
    const r = await fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) });
    if (!r.ok && (r.headers.get('content-type') || '').includes('json')) throw new Error((await r.json()).error || 'Request failed');
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.sources) sources = ev.sources;
        if (ev.delta) { answer += ev.delta; b.innerHTML = md(answer); scrollDown(); }
        if (ev.error) throw new Error(ev.error);
      }
    }
    if (!answer) throw new Error('No answer came back — please try again.');
    history.push({ role: 'assistant', content: answer });
    b.innerHTML = md(answer) + renderSources(sources, answer);
    linkify(b);
  } catch (e) {
    const msg = /429|rate/i.test(e.message) ? 'The free AI model is busy right now. Please try again in a moment.' : e.message;
    b.innerHTML = (answer ? md(answer) : '') + `<p class="err">${esc(msg)}</p>`;
    if (!answer) history.pop();
  }
  busy = false; autosize(); scrollDown();
  if (matchMedia('(pointer:fine)').matches) q.focus();
}

form.addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => ask(c.dataset.q)));
newBtn.addEventListener('click', () => { if (busy) return; history = []; log.innerHTML = ''; hero.hidden = false; newBtn.hidden = true; q.value = ''; autosize(); window.scrollTo({ top: 0 }); });
</script>
</body>
</html>
