<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg:#f6f4ef; --panel:#fff; --ink:#1d1b18; --muted:#6b665d; --line:#e4dfd5; --accent:#8a6a2f; --user:#1d1b18; --userink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141311; --panel:#1d1c19; --ink:#ece8df; --muted:#9b958a; --line:#2e2c28; --accent:#d1ad6a; --user:#ece8df; --userink:#141311; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:0 16px; display:flex; flex-direction:column; height:100dvh; }
  header { padding:18px 0 12px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; letter-spacing:.02em; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:18px 0; }
  .msg { margin:0 0 16px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:88%; padding:10px 14px; border-radius:14px; background:var(--panel); border:1px solid var(--line); overflow-wrap:anywhere; }
  .user .bubble { background:var(--user); color:var(--userink); border-color:var(--user); }
  .bubble p { margin:.3em 0; } .bubble ul,.bubble ol { margin:.3em 0; padding-left:1.3em; }
  .bubble a { color:var(--accent); }
  .src { margin-top:8px; font-size:12px; color:var(--muted); }
  .src a { color:var(--muted); }
  .err { color:#c0392b; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 0; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  form { display:flex; gap:8px; padding:12px 0 18px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:10px 12px; font:inherit; min-height:44px; max-height:160px; }
  button.send { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 18px; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--muted); animation:b 1s infinite; margin-right:3px; }
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes b { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Property Assistant · DarGlobal &amp; Wasalt</h1>
    <p id="meta">Answers from publicly available data on darglobal.co.uk and wasalt.sa, generated by a free OpenRouter model.</p>
  </header>
  <div id="log">
    <div class="msg"><div class="bubble">
      Hi! Ask me about DarGlobal's projects (Dubai, Oman, Saudi Arabia, Qatar, Spain, UK…) or Wasalt property listings in Saudi Arabia.
      <div class="chips">
        <button class="chip">What DarGlobal projects are in Oman?</button>
        <button class="chip">Tell me about The Astera by Aston Martin</button>
        <button class="chip">How many 3 bedroom apartments are for rent on Wasalt?</button>
        <button class="chip">What property types does Wasalt list in Jeddah?</button>
      </div>
    </div></div>
  </div>
  <form id="f">
    <textarea id="q" rows="1" placeholder="Ask about a project, city or listing…" autofocus></textarea>
    <button class="send" id="send">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), f = document.getElementById('f'), sendBtn = document.getElementById('send');
const history = [];
const md = s => DOMPurify.sanitize(marked.parse(s));

fetch('api/health').then(r => r.json()).then(h => {
  document.getElementById('meta').textContent =
    `${h.darglobal_pages} DarGlobal pages · ${h.wasalt_listings.toLocaleString()} Wasalt listings indexed · model: ${h.models[0]}`;
}).catch(() => {});

function add(role, html) {
  const m = document.createElement('div'); m.className = 'msg ' + role;
  const b = document.createElement('div'); b.className = 'bubble'; b.innerHTML = html;
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight; return b;
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function ask(text) {
  text = text.trim(); if (!text) return;
  add('user', esc(text)); history.push({role:'user', content:text});
  q.value = ''; sendBtn.disabled = true;
  const b = add('bot', '<span class="dot"></span><span class="dot"></span><span class="dot"></span>');
  let answer = '', sources = [], buf = '';
  try {
    const r = await fetch('api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: history})});
    if (!r.ok && r.headers.get('content-type')?.includes('json')) throw new Error((await r.json()).error);
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.sources) sources = ev.sources;
        if (ev.delta) { answer += ev.delta; b.innerHTML = md(answer); log.scrollTop = log.scrollHeight; }
        if (ev.error) throw new Error(ev.error);
      }
    }
    if (!answer) throw new Error('The model returned an empty answer — please try again.');
    history.push({role:'assistant', content:answer});
    if (sources.length) b.innerHTML += '<div class="src">Sources: ' + sources.slice(0,5).map(s =>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}: ${esc(s.title.slice(0,60))}</a>`).join(' · ') + '</div>';
  } catch (e) {
    b.innerHTML = (answer ? md(answer) : '') + `<p class="err">⚠ ${esc(e.message)}</p>`;
    if (!answer) history.pop();
  }
  sendBtn.disabled = false; q.focus();
}
f.addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => ask(c.textContent)));
</script>
</body>
</html>
